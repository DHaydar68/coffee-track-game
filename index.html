<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Track Game</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5e6d3;
  text-align: center;
  margin: 0;
  padding: 20px;
  color: #654321;
}

h1 {
  font-size: 32px;
}

#gameArea {
  position: relative;
  width: 100%;
  max-width: 500px;
  height: 350px;
  margin: 20px auto;
  background: #fff8ef;
  border: 3px solid #8b6f5e;
  border-radius: 15px;
  overflow: hidden;
  touch-action: none;
}

#basket {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 50px;
  user-select: none;
  touch-action: none;
}

.coffee {
  position: absolute;
  top: -50px;
  font-size: 35px;
  user-select: none;
  pointer-events: none;
}

#stats {
  display: flex;
  justify-content: space-around;
  max-width: 500px;
  margin: auto;
  font-size: 20px;
  font-weight: bold;
}

button {
  background: #8b5e3c;
  color: white;
  border: none;
  padding: 15px 25px;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
}

button:hover {
  background: #654321;
}

#message {
  font-size: 18px;
  margin: 15px;
}
</style>
</head>

<body>

<h1>☕ Coffee Track</h1>

<p>Catch as many coffee cups as you can!</p>

<div id="stats">
  <span>⭐ Score: <span id="score">0</span></span>
  <span>⏱️ Time: <span id="time">30</span>s</span>
</div>

<div id="gameArea">
  <div id="basket">🧺</div>
</div>

<p id="message">Ready to play?</p>

<button id="startButton" onclick="startGame()">
  Start Game 🎮
</button>

<p>Drag your finger or move your mouse to catch coffee ☕</p>

<script>
const gameArea = document.getElementById("gameArea");
const basket = document.getElementById("basket");
const scoreDisplay = document.getElementById("score");
const timeDisplay = document.getElementById("time");
const message = document.getElementById("message");
const startButton = document.getElementById("startButton");

let score = 0;
let timeLeft = 30;
let playing = false;
let coffees = [];
let spawnInterval;
let timerInterval;
let animationFrame;

function moveBasket(clientX) {
  const rect = gameArea.getBoundingClientRect();
  const x = clientX - rect.left;

  const basketWidth = basket.offsetWidth;

  const newX = Math.max(
    basketWidth / 2,
    Math.min(x, rect.width - basketWidth / 2)
  );

  basket.style.left = newX + "px";
}

gameArea.addEventListener("pointermove", function(e) {
  if (playing) {
    moveBasket(e.clientX);
  }
});

gameArea.addEventListener("pointerdown", function(e) {
  if (playing) {
    moveBasket(e.clientX);
  }
});

function createCoffee() {
  if (!playing) return;

  const coffee = document.createElement("div");
  coffee.className = "coffee";
  coffee.textContent = "☕";

  const maxX = gameArea.clientWidth - 40;
  const x = Math.random() * maxX;

  coffee.style.left = x + "px";
  coffee.style.top = "-50px";

  gameArea.appendChild(coffee);

  coffees.push({
    element: coffee,
    y: -50,
    speed: 2 + Math.random() * 2
  });
}

function updateGame() {
  if (!playing) return;

  const basketRect = basket.getBoundingClientRect();

  coffees.forEach((coffee, index) => {
    coffee.y += coffee.speed;
    coffee.element.style.top = coffee.y + "px";

    const coffeeRect = coffee.element.getBoundingClientRect();

    const caught =
      coffeeRect.bottom >= basketRect.top &&
      coffeeRect.top <= basketRect.bottom &&
      coffeeRect.right >= basketRect.left &&
      coffeeRect.left <= basketRect.right;

    if (caught) {
      score++;
      scoreDisplay.textContent = score;

      coffee.element.remove();
      coffees.splice(index, 1);
    }

    else if (coffee.y > gameArea.clientHeight) {
      coffee.element.remove();
      coffees.splice(index, 1);
    }
  });

  animationFrame = requestAnimationFrame(updateGame);
}

function startGame() {
  clearInterval(spawnInterval);
  clearInterval(timerInterval);
  cancelAnimationFrame(animationFrame);

  coffees.forEach(coffee => coffee.element.remove());
  coffees = [];

  score = 0;
  timeLeft = 30;
  playing = true;

  scoreDisplay.textContent = score;
  timeDisplay.textContent = timeLeft;

  message.textContent = "Catch the coffee! ☕";
  startButton.style.display = "none";

  basket.style.left = "50%";

  spawnInterval = setInterval(createCoffee, 700);

  timerInterval = setInterval(function() {
    timeLeft--;
    timeDisplay.textContent = timeLeft;

    if (timeLeft <= 0) {
      endGame();
    }
  }, 1000);

  updateGame();
}

function endGame() {
  playing = false;

  clearInterval(spawnInterval);
  clearInterval(timerInterval);
  cancelAnimationFrame(animationFrame);

  message.textContent =
    "🎉 Game Over! Your score: " + score;

  startButton.textContent = "Play Again 🎮";
  startButton.style.display = "inline-block";
}
</script>

</body>
</html>
